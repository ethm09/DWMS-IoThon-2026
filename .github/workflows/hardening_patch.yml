name: Harden DWMS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hardening patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"Pattern not found in {path}: {old[:100]}")
              p.write_text(s.replace(old,new,1))

          replace('convex/devices.ts',
          'import { query, mutation, internalMutation } from "./_generated/server";',
          'import { query, mutation, internalMutation, internalQuery } from "./_generated/server";')
          replace('convex/devices.ts',
          'handler: async (ctx): Promise<Doc<"devices">[]> => {\n    return await ctx.db.query("devices").collect();',
          'handler: async (ctx): Promise<Array<Omit<Doc<"devices">, "apiKey">>> => {\n    return await ctx.db.query("devices").collect().then((devices) => devices.map(({ apiKey: _apiKey, ...safeDevice }) => safeDevice));')
          replace('convex/devices.ts',
          '// Generate a simple API key\n    const apiKey = `ldwms_${args.deviceId}_${Date.now()}`;',
          '// Generate a cryptographically random device API key. Never derive secrets from predictable identifiers or timestamps.\n    const apiKey = `dwms_${crypto.randomUUID().replaceAll("-", "")}`;')
          replace('convex/devices.ts',
          'export const internalSaveReading = mutation({',
          'export const internalSaveReading = internalMutation({')
          replace('convex/devices.ts',
          'await ctx.scheduler.runAfter(10_000, internal.devices.checkDeviceStale, {',
          'await ctx.scheduler.runAfter(30_000, internal.devices.checkDeviceStale, {')
          replace('convex/devices.ts',
          'const level = args.ph < 5.0 || args.ph > 10.0 ? "critical" : "warning";',
          'const level = args.ph < 5.5 || args.ph > 10.0 ? "critical" : "warning";')
          replace('convex/devices.ts',
          '// TDS thresholds: warning >500, critical >800',
          '// TDS thresholds: warning 500–1500, critical >1500')
          replace('convex/devices.ts',
          'const level = args.tds > 800 ? "critical" : "warning";',
          'const level = args.tds > 1500 ? "critical" : "warning";')
          replace('convex/devices.ts',
          'export const validateApiKey = query({',
          'export const validateApiKey = internalQuery({')
          replace('convex/devices.ts',
          'handler: async (ctx, args): Promise<void> => {\n    const now = new Date().toISOString();',
          'handler: async (ctx, args): Promise<void> => {\n    if (!Number.isFinite(args.ph) || !Number.isFinite(args.tds) || !Number.isFinite(args.turbidity)) {\n      throw new ConvexError({ message: "Sensor values must be finite numbers", code: "BAD_REQUEST" });\n    }\n    if (args.ph < 0 || args.ph > 14 || args.tds < 0 || args.turbidity < 0) {\n      throw new ConvexError({ message: "Sensor values are outside accepted ranges", code: "BAD_REQUEST" });\n    }\n\n    const now = new Date().toISOString();')
          replace('convex/http.ts',
          'import { api } from "./_generated/api";',
          'import { internal } from "./_generated/api";')
          replace('convex/http.ts',
          'ctx.runQuery(api.devices.validateApiKey, { apiKey })',
          'ctx.runQuery(internal.devices.validateApiKey, { apiKey })')
          replace('convex/http.ts',
          'const ph = typeof body.ph === "number" ? body.ph : undefined;\n    const tds = typeof body.tds === "number" ? body.tds : undefined;\n    const turbidity = typeof body.turbidity === "number" ? body.turbidity : undefined;',
          'const ph = typeof body.ph === "number" && Number.isFinite(body.ph) ? body.ph : undefined;\n    const tds = typeof body.tds === "number" && Number.isFinite(body.tds) ? body.tds : undefined;\n    const turbidity = typeof body.turbidity === "number" && Number.isFinite(body.turbidity) ? body.turbidity : undefined;')
          replace('convex/http.ts',
          'ctx.runMutation(api.devices.internalSaveReading, {',
          'ctx.runMutation(internal.devices.internalSaveReading, {')
          replace('convex/chatAction.ts',
          'import { v } from "convex/values";',
          'import { ConvexError, v } from "convex/values";')
          replace('convex/chatAction.ts',
          'handler: async (_ctx, args) => {\n    const openai',
          'handler: async (ctx, args) => {\n    const identity = await ctx.auth.getUserIdentity();\n    if (!identity) {\n      throw new ConvexError({ code: "UNAUTHENTICATED", message: "Sign in to use Ethm AI." });\n    }\n\n    const openai')
          replace('convex/chatAction.ts',
          'water quality (pH, TDS, turbidity, flow rate), controls a pump and filtration,',
          'water quality (pH, TDS, turbidity), controls a pump and filtration,')
          replace('convex/chatAction.ts',
          'Monitor pH, TDS, turbidity, flow rate, pump status, and system mode.',
          'Monitor pH, TDS, turbidity, pump status, and system mode. Flow rate is a control/simulation parameter unless explicitly supplied by a connected device.')
          replace('convex/chatAction.ts',
          'TDS: Safe <500 ppm; Warning 500–1000 ppm; Critical >1500 ppm',
          'TDS: Safe <500 ppm; Warning 500–1500 ppm; Critical >1500 ppm')
          replace('convex/chatAction.ts',
          'Turbidity: Safe <5 NTU; Warning 5–20 NTU; Critical >50 NTU',
          'Turbidity: Safe <5 NTU; Warning 5–50 NTU; Critical >50 NTU')
          replace('convex/chatAction.ts',
          'TDS > 1500 is critical and starts filtration in Auto mode.',
          'TDS > 1500 is critical and requests filtration in Auto mode; do not claim filtration reduces TDS unless the connected treatment process is validated to do so.')
          replace('convex/chatAction.ts',
          'Turbidity > 20 starts filtration in Auto mode.',
          'Turbidity > 20 requests filtration in Auto mode.')
          replace('src/lib/dwms-safety.ts',
          'if (levels.includes("critical")) return "critical";\n  if (levels.includes("warning")) return "warning";\n  return "safe";',
          'if (levels.length === 0) return "warning";\n  if (levels.includes("critical")) return "critical";\n  if (levels.includes("warning")) return "warning";\n  return "safe";')
          replace('src/lib/dwms-safety.ts',
          '  const flow = r.flowRate ?? undefined;\n\n  // ── Level 3',
          '  const flow = r.flowRate ?? undefined;\n\n  // Missing sensor data must never be treated as SAFE. Hold automatic decisions until a valid reading is available.\n  if (ph === undefined && tds === undefined && turb === undefined && flow === undefined) {\n    return {\n      kind: "advisory",\n      parameter: "Data Quality",\n      riskLevel: "warning",\n      reason: "No valid sensor readings are available.",\n      recommendation: "Hold automatic process decisions and restore the data connection before operating on live conditions.",\n    };\n  }\n\n  // ── Level 3')
          replace('src/lib/dwms-safety.ts',
          'recommendation: "Start filtration immediately to dilute dissolved solids.",',
          'recommendation: "Start the configured filtration response; do not assume filtration reduces TDS unless the connected treatment process is validated to do so.",')
          replace('src/components/providers/process-mode.tsx',
          'import { toast } from "sonner";\n', '')
          replace('src/components/providers/process-mode.tsx',
          '      if (m === "hardware") {\n        setHardwareStatus("disconnected");\n        lastHardwareAt.current = null;\n      }',
          '      if (m === "hardware") {\n        setHardwareStatus("disconnected");\n        lastHardwareAt.current = null;\n        setSensorDataState(null);\n        setReadings({ ph: null, tds: null, turbidity: null, flowRate: null });\n        persist({ dataMode: m, ph: null, tds: null, turbidity: null, flowRate: null });\n      }')
          start=s.index('  // Auto-revert to demo if hardware mode stays disconnected for 30 seconds.')
          end=s.index('  // Keep state synchronized across tabs/windows.', start)
          s=Path('src/components/providers/process-mode.tsx').read_text()
          block=s[start:end]
          Path('src/components/providers/process-mode.tsx').write_text(s[:start] + '''  // Hardware mode is sticky. A lost connection remains visible as a hardware/data-quality problem; it never silently switches to demo data.\n  useEffect(() => {\n    if (dataMode !== "hardware") return;\n    if (hardwareStatus === "disconnected" && sensorData !== null) {\n      setSensorDataState(null);\n      setReadings({ ph: null, tds: null, turbidity: null, flowRate: null });\n      persist({ ph: null, tds: null, turbidity: null, flowRate: null });\n    }\n  }, [dataMode, hardwareStatus, sensorData, persist]);\n\n''' + s[end:])
          PY
      - name: Verify key invariants
        run: |
          grep -q 'internalQuery' convex/devices.ts
          grep -q 'crypto.randomUUID' convex/devices.ts
          grep -q 'internal.devices.validateApiKey' convex/http.ts
          grep -q 'Sign in to use Ethm AI' convex/chatAction.ts
          grep -q 'never silently switches' src/components/providers/process-mode.tsx
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex src
          git diff --cached --quiet || git commit -m "Harden DWMS data security and safety handling"
          git push
