name: DWMS Hardening

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONVEX_AGENT_MODE: anonymous

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex bindings in an isolated local backend
        run: bash scripts/prepare-convex-build.sh

      - name: Test ingestion, safety and communication failures
        run: pnpm test

      - name: Verify isolated HTTP-to-backend demonstration (synthetic input, no hardware)
        run: pnpm demo:e2e

      - name: Test controller logic on host (not an Arduino board build)
        run: |
          g++ -std=c++11 -Wall -Wextra -I tests/firmware tests/firmware/controller_test.cpp -o /tmp/dwms-controller-test
          /tmp/dwms-controller-test

      - name: Lint DWMS
        run: pnpm run lint

      - name: Build DWMS
        run: pnpm run build

      - name: Check for exposed environment files
        shell: bash
        run: |
          if git ls-files --cached \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -vE '(^|/)\.env\.example$' \
            | grep -q .; then

            echo "ERROR: Environment files must not be committed."
            exit 1
          fi

          echo "Environment-file check passed."

      - name: Check repository for obvious secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='hardening.yml' \
            '(sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\''])' \
            .; then

            echo "ERROR: Possible exposed secret detected."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Validation report
        run: |
          echo "======================================"
          echo "DWMS HARDENING VALIDATION"
          echo "======================================"
          echo "Dependencies: PASS"
          echo "Convex Codegen: PASS"
          echo "Behavioral software tests: PASS"
          echo "Physical hardware validation: NOT PERFORMED BY CI"
          echo "Lint: PASS"
          echo "Build: PASS"
          echo "Environment check: PASS"
          echo "Secret scan: PASS"
          echo "======================================"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.6.0

      - name: Compile Arduino Uno target with calibration and relay disabled
        env:
          DWMS_ARDUINO_WORK_DIR: ${{ runner.temp }}/dwms-arduino
        run: bash scripts/compile-arduino.sh "${{ runner.temp }}/dwms-uno-evidence"

      - name: Preserve target compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-uno-compile-evidence
          path: ${{ runner.temp }}/dwms-uno-evidence/
          if-no-files-found: warn
