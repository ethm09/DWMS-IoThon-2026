name: DWMS Hardening

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex bindings
        run: pnpm exec convex codegen

      - name: Build DWMS
        run: pnpm run build

      - name: Check for exposed environment files
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name ".env" -o -name ".env.local" -o -name ".env.production" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "ERROR: Environment files must not be committed."
            exit 1
          fi

          echo "Environment-file check passed."

      - name: Check repository for obvious secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='hardening.yml' \
            '(sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\''])' \
            .; then

            echo "ERROR: Possible exposed secret detected."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Validation report
        run: |
          echo "======================================"
          echo "DWMS HARDENING VALIDATION"
          echo "======================================"
          echo "Dependencies: PASS"
          echo "Convex Codegen: PASS"
          echo "Build: PASS"
          echo "Environment check: PASS"
          echo "Secret scan: PASS"
          echo "======================================"
