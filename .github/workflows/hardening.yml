name: DWMS Hardening

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONVEX_AGENT_MODE: anonymous

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize an anonymous local Convex deployment
        run: pnpm exec convex init

      - name: Generate Convex bindings in an isolated local backend
        shell: bash
        run: |
          auth_config_backup="$(mktemp)"
          cp convex/auth.config.ts "$auth_config_backup"
          restore_auth_config() {
            cp "$auth_config_backup" convex/auth.config.ts
            rm -f "$auth_config_backup"
          }
          trap restore_auth_config EXIT

          cat > convex/auth.config.ts <<'EOF'
          import { AuthConfig } from "convex/server";

          export default {
            providers: [],
          } satisfies AuthConfig;
          EOF

          pnpm exec convex dev --once

      - name: Lint DWMS
        run: pnpm run lint

      - name: Build DWMS
        run: pnpm run build

      - name: Check for exposed environment files
        shell: bash
        run: |
          if git ls-files --cached \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -vE '(^|/)\.env\.example$' \
            | grep -q .; then

            echo "ERROR: Environment files must not be committed."
            exit 1
          fi

          echo "Environment-file check passed."

      - name: Check repository for obvious secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='hardening.yml' \
            '(sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\''])' \
            .; then

            echo "ERROR: Possible exposed secret detected."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Validation report
        run: |
          echo "======================================"
          echo "DWMS HARDENING VALIDATION"
          echo "======================================"
          echo "Dependencies: PASS"
          echo "Convex Codegen: PASS"
          echo "Lint: PASS"
          echo "Build: PASS"
          echo "Environment check: PASS"
          echo "Secret scan: PASS"
          echo "======================================"

