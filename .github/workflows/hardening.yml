name: DWMS Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DWMS
        run: pnpm run build

      - name: Check for exposed environment files
        shell: bash
        run: |
          if find . -type f \( -name ".env" -o -name ".env.local" -o -name ".env.production" \) | grep -q .; then
            echo "ERROR: Environment files must not be committed."
            exit 1
          fi

          echo "Environment-file check passed."

      - name: Check repository for obvious secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='*.lock' \
            --exclude='hardening.yml' \
            '(sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\''])' \
            .; then
            echo "ERROR: Possible exposed secret detected."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Report
        run: |
          echo "======================================"
          echo "DWMS HARDENING VALIDATION PASSED"
          echo "======================================"
          echo "Build: PASS"
          echo "Environment files: PASS"
          echo "Basic secret scan: PASS"
          echo "======================================"
